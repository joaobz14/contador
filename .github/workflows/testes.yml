name: Testes

# Roda a suite de testes (pytest) em cada Pull Request e em pushes no main.
# Assim cada PR mostra um check verde/vermelho automaticamente no GitHub.
on:
  push:
    branches: [main]
  pull_request:

# Menor privilegio para o GITHUB_TOKEN destes jobs (varredura de seguranca de
# 2026-08-06, com o repositorio PUBLICO). Sem este bloco o token herda o padrao
# do repositorio, que pode incluir ESCRITA — e nenhum job aqui escreve nada:
# todos so baixam o codigo e rodam teste/lint. Um passo comprometido (uma acao
# de terceiro, uma dependencia trocada) teria, sem isto, credencial para
# commitar no repo.
#
# NAO e o mesmo que a protecao do `pull_request`: aquele gatilho (e nao
# `pull_request_target`, de proposito) ja garante que PR de fork roda sem
# segredo e com token restrito. Este bloco fecha o outro lado, o `push` em
# main, que roda com o token cheio.
permissions:
  contents: read

jobs:
  lint:
    # Linter (ruff): pega import morto / nome indefinido antes da revisao manual
    # (auditoria 5.13). Config em ruff.toml — comeca pelas regras F + E9.
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar o ruff
        run: pip install "ruff==0.15.8"

      - name: Rodar o ruff
        run: ruff check .

  obsidian:
    # Valida o cofre de conhecimento (obsidian/): links, frontmatter, vazios,
    # colisoes de nome, referencias de fonte e segredos. Job leve — so a stdlib,
    # sem instalar o app inteiro.
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validar o cofre Obsidian
        run: python tools/validar_obsidian.py

      - name: Testar o validador
        # --noconftest: o teste so usa a stdlib (nao as fixtures do
        # tests/conftest.py, que importa o app e exigiria instalar requests).
        # Mantem o job leve, sem instalar as dependencias da aplicacao.
        run: pip install pytest && pytest tests/test_validar_obsidian.py -q --noconftest

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        # Inclui as do bot para a suite do bot rodar de verdade no runner
        # (no GitHub o python-telegram-bot importa normalmente).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-bot.txt

      - name: Rodar os testes
        run: pytest -q

  gui-smoke:
    # Abre a TELA de verdade, headless (xvfb), nos dois marketplaces e captura
    # um screenshot de cada. Pega o que o pytest nao cobre: quebra de import,
    # erro de montagem/renderizacao do Tkinter na inicializacao. Os PNGs ficam
    # disponiveis como artefato do run (bom para conferir o layout num PR).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (xvfb + imagemagick para o screenshot)
        # DEBIAN_FRONTEND/NEEDRESTART_MODE evitam o apt-get travar esperando
        # input: o imagemagick aciona o needrestart, que em runners recentes
        # abre um prompt interativo (lista de servicos a reiniciar) mesmo com
        # -y — sem terminal na CI, o job fica preso ate estourar o timeout
        # (6h) sem nunca dar erro (visto na pratica: todos os outros jobs do
        # mesmo run terminam em segundos, so este trava).
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Abrir a tela e capturar (Mercado Livre e Shopee)
        run: |
          python -c "import tkinter; print('tkinter OK,', tkinter.TkVersion)"
          xvfb-run -a python tools/gui_screenshot.py tela_ml.png
          xvfb-run -a python tools/gui_screenshot.py tela_shopee.png Shopee

      - name: Provar que este job REPROVA com a tela quebrada
        # Sem esta prova, o job so garante que o screenshot foi tirado. O Tk
        # engole excecao de callback (`after`, clique, trace) e segue, entao
        # ate 2026-08-05 um erro na abertura saia com codigo 0 e o job ficava
        # VERDE com a tela quebrada. `--autoteste` agenda um callback que
        # estoura de proposito: se o script NAO reprovar, o guardiao parou de
        # guardar e este passo falha.
        run: |
          if xvfb-run -a python tools/gui_screenshot.py /tmp/autoteste.png "Mercado Livre" --autoteste; then
            echo "::error::gui_screenshot saiu com 0 mesmo com callback quebrado - o guardiao nao guarda mais nada"
            exit 1
          fi
          echo "OK: o guardiao reprovou como deveria."

      - name: Publicar screenshots (artefato do run)
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: |
            tela_ml.png
            tela_shopee.png
